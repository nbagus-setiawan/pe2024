<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>PE2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F1F9F4;--card:#FFFFFF;--ink:#0B2A1A;--muted:#5B7266;--line:#D3E8DA;--blue:#0A8F45;--tint:#E2F5E9;--sun:#FFC93C;
  --serif:"Century Gothic",CenturyGothic,"Apple Gothic",Questrial,"Segoe UI",sans-serif;--sans:"Century Gothic",CenturyGothic,"Apple Gothic",Questrial,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--w:500px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.wrap{position:relative;max-width:var(--w);margin:0 auto;padding:0 20px 64px;overflow-x:clip}

/* Bar mini + progres baca */
.bar{position:fixed;left:0;right:0;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:rgba(241,249,244,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transform:translateY(-110%);transition:transform .45s var(--ease)}
.bar.show{transform:none}
.bar .in2{max-width:var(--w);margin:0 auto;display:flex;align-items:center;gap:14px;padding:16px 20px}
.bar img{width:44px;height:44px;object-fit:contain}
.bar b{font-family:var(--serif);font-weight:800;font-size:1.5rem;letter-spacing:-.01em}
.prog{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--blue);transform-origin:left;transform:scaleX(0)}

/* Hero */
.hero{position:relative;text-align:center;padding:56px 0 36px;isolation:isolate}
.dots{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(var(--line) 1.6px,transparent 1.7px);background-size:20px 20px;-webkit-mask-image:linear-gradient(#000 20%,transparent 95%);mask-image:linear-gradient(#000 20%,transparent 95%)}
.sh{position:absolute;z-index:-1}
.s1{width:clamp(120px,38vw,190px);aspect-ratio:1;border-radius:50%;background:var(--blue);top:clamp(-70px,-12vw,-44px);right:clamp(-70px,-12vw,-44px);animation:grow 1s var(--ease) 2.1s both,drift 9s ease-in-out 3.2s infinite alternate}
.s2{width:clamp(80px,24vw,120px);height:clamp(40px,12vw,60px);border-radius:120px 120px 0 0;background:var(--sun);top:0;left:-20px;rotate:-18deg;transform-origin:left bottom;animation:grow 1s var(--ease) 2.25s both}
.s3{width:clamp(50px,15vw,74px);aspect-ratio:1;border-radius:50%;border:clamp(8px,2.4vw,12px) solid var(--sun);top:clamp(110px,30vw,150px);right:-16px;animation:grow 1s var(--ease) 2.4s both,drift 7s ease-in-out 3.2s infinite alternate-reverse}
@keyframes grow{from{transform:scale(.3);opacity:0}}
@keyframes drift{to{translate:0 14px}}

.logo{display:block;object-fit:contain}
.hero .logo{width:clamp(88px,26vw,112px);height:clamp(88px,26vw,112px);margin:0 auto 20px}

/* Tipografi */
h1{font-family:var(--serif);font-weight:800;font-size:clamp(2.5rem,13.5vw,3.7rem);line-height:1;letter-spacing:-.02em;margin:0 0 16px;display:flex;justify-content:center;max-width:100%}
h1 .m{display:inline-block;overflow:hidden;padding:0 .01em .08em}
h1 .ch{display:inline-block;transform:translateY(112%);animation:up .9s var(--ease) forwards;animation-delay:calc(1.95s + var(--k)*.07s)}
@keyframes up{to{transform:none}}
.tag{margin:0 auto;max-width:30ch;color:var(--muted);font-size:1.02rem;line-height:1.45}
.tag b{display:block;font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--ink);margin-bottom:3px}
h2{font-family:var(--serif);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;margin:34px 0 14px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
h2 small{font-family:var(--sans);font-weight:500;font-size:.8rem;color:var(--muted);order:3;letter-spacing:0;white-space:nowrap}

/* Animasi masuk */
.intro{position:fixed;inset:0;z-index:10;background:#fff;display:grid;place-items:center;animation:lift .9s cubic-bezier(.76,0,.24,1) 1.5s forwards}
.intro .logo{width:120px;height:120px;animation:pop .9s var(--ease) .15s both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes lift{0%{transform:none}99%{transform:translateY(-100%)}100%{transform:translateY(-100%);visibility:hidden}}
.fade{opacity:0;transform:translateY(14px);animation:rise .8s var(--ease) forwards;animation-delay:calc(2.2s + var(--i,0)*.1s)}
@keyframes rise{to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(22px) scale(.98);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.rv.on{opacity:1;transform:none}

ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
li{min-width:0}
a{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;height:100%;padding:12px 16px 12px 12px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;
  transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease),box-shadow .25s}
a::before{content:"";position:absolute;inset:0;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),var(--tint),transparent 70%);opacity:0;transition:opacity .3s}
a>*{position:relative}
.bd{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--tint);color:var(--blue);font-family:var(--serif);font-weight:800;font-size:1.25rem;transition:background .25s,color .25s,transform .35s var(--ease)}
.bd.y{background:var(--sun);color:var(--ink);font-family:var(--sans);font-weight:700;font-size:.78rem;letter-spacing:.03em}
.bd svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{flex:1;min-width:0}
.t{display:block;font-weight:700;font-size:1.05rem;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.c{display:block;font-size:.88rem;color:var(--muted);margin-top:1px;transition:color .25s;overflow-wrap:anywhere}
svg.go{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--blue);transition:transform .35s var(--ease),color .25s}
@media (hover:hover){
  a:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 8px 0 -2px rgba(10,143,69,.16)}
  a:hover::before{opacity:1}
  a:hover svg.go{transform:translateX(5px)}
  a:hover .bd{background:var(--blue);color:#fff;transform:rotate(-6deg) scale(1.06)}
  a:hover .bd.y{background:var(--sun);color:var(--ink)}
}
a:active{transform:scale(.975);transition-duration:.08s}
a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

a.feat{background:var(--blue);border-color:var(--blue);color:#fff;padding:16px 18px 16px 16px;box-shadow:0 10px 0 -4px rgba(10,143,69,.22)}
a.feat::before{background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.18),transparent 70%)}
a.feat .bd{background:#fff;color:var(--blue);width:56px;height:56px;border-radius:17px}
a.feat .t{font-size:1.2rem}
a.feat .c{color:rgba(255,255,255,.85)}
a.feat svg.go{color:var(--sun)}
@media (hover:hover){a.feat:hover{border-color:var(--blue);box-shadow:0 12px 0 -4px rgba(10,143,69,.26)}a.feat:hover .bd{background:var(--sun);color:var(--ink)}}

footer{margin-top:40px;text-align:center;color:var(--muted);font-size:.85rem}
footer b{font-family:var(--serif);font-weight:700;color:var(--ink)}

/* ===== RESPONSIF ===== */
/* HP kecil */
@media (max-width:360px){
  .wrap,.bar .in2{padding-left:14px;padding-right:14px}
  .wrap{padding-bottom:48px}
  .hero{padding-top:48px}
  a{gap:11px;padding:10px 12px 10px 10px}
  .bd{width:42px;height:42px;font-size:1.1rem}
  .t{font-size:1rem}
  a.feat .bd{width:50px;height:50px}
  a.feat .t{font-size:1.1rem}
  h2{font-size:1.15rem;gap:8px}
}
/* Layar landscape pendek */
@media (max-height:520px) and (orientation:landscape){.hero{padding:40px 0 24px}}
/* Tablet: 2 kolom */
@media (min-width:700px){
  :root{--w:700px}
  .wrap,.bar .in2{padding-left:28px;padding-right:28px}
  ul.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .hero{padding:72px 0 44px}
  .tag{max-width:36ch}
}
/* Desktop: 3 kolom */
@media (min-width:1024px){
  :root{--w:980px}
  ul.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:1500px){:root{--w:1100px}}
/* Perangkat sentuh: area ketuk nyaman */
@media (hover:none){a{min-height:64px}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .intro{display:none}
  .fade,.s1,.s2,.s3,h1 .ch{animation:none;opacity:1;transform:none}
  .rv{opacity:1;transform:none;transition:none}
  a,svg.go,.bd,.bar{transition:none}
}
</style>
</head>
<body>

<div class="intro" aria-hidden="true">
  <img class="logo" src="img/logo.png" alt="" onerror="this.style.display='none'">
</div>

<div class="bar" id="bar" aria-hidden="true">
  <div class="in2"><img src="img/logo.png" alt="" onerror="this.style.display='none'"><b>PE2024</b></div>
  <div class="prog" id="prog"></div>
</div>

<div class="wrap">
  <section class="hero" id="hero">
    <div class="dots"></div><div class="sh s1"></div><div class="sh s2"></div><div class="sh s3"></div>
    <img class="logo fade" src="img/logo.png" alt="Logo PE2024" onerror="this.style.display='none'">
    <h1 aria-label="PE2024" id="title"></h1>
    <p class="tag fade" style="--i:3"><b>Pendidikan Ekonomi</b>Kelas Putak<br>Nurul Huda, Sukaraja</p>
  </section>

  <div id="groups"></div>

  <footer class="rv"><b>PE2024</b> &middot; Universitas Nurul Huda</footer>
</div>

<script>
/* GANTI url dengan link Anda (Google Form untuk pengumpulan tugas).
   b = isi lencana kiri; y:true = lencana kuning.
   Link yang diawali https:// terbuka di tab baru; link internal (profile.html) terbuka di tab yang sama. */
var user='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4.5-6 8-6s7 2 8 6"/></svg>';
var groups=[
  {h:"",feat:true,items:[
    {t:"Profile",c:"Tentang PE2024",b:user,url:"profile.html"}]},
  {h:"Pengumpulan tugas",items:[
    {t:"Tugas 1",c:"Unggah dalam format PDF",b:"1",url:"#"},
    {t:"Tugas 2",c:"Unggah dalam format PDF",b:"2",url:"#"},
    {t:"Tugas 3",c:"Unggah dalam format PDF",b:"3",url:"#"},
    {t:"Tugas 4",c:"Unggah dalam format PDF",b:"4",url:"#"},
    {t:"Tugas 5",c:"Unggah dalam format PDF",b:"5",url:"#"},
    {t:"Tugas 6",c:"Unggah dalam format PDF",b:"6",url:"#"},
    {t:"Tugas 7",c:"Unggah dalam format PDF",b:"7",url:"#"},
    {t:"Tugas 8",c:"Unggah dalam format PDF",b:"8",url:"#"},
    {t:"Ujian Tengah Semester",c:"Lembar jawaban dan berkas pendukung",b:"UTS",y:true,url:"#"},
    {t:"Ujian Akhir Semester",c:"Lembar jawaban dan berkas pendukung",b:"UAS",y:true,url:"#"}]}
];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var arrow='<svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* Judul: huruf naik satu per satu */
document.getElementById("title").innerHTML="PE2024".split("").map(function(c,k){return '<span class="m" aria-hidden="true"><span class="ch" style="--k:'+k+'">'+c+'</span></span>'}).join("");

document.getElementById("groups").innerHTML=groups.map(function(g){
  return (g.h?'<h2 class="rv">'+esc(g.h)+'<small>'+g.items.length+' tautan</small></h2>':'')+'<ul'+(g.feat?'':' class="grid"')+'>'+g.items.map(function(l){
    var bd=l.b.charAt(0)==="<"?l.b:esc(l.b);
    var ext=/^https?:/.test(l.url);
    return '<li class="rv"><a class="'+(g.feat?'feat':'')+'" href="'+esc(l.url)+'"'+(ext?' target="_blank" rel="noopener"':'')+'><span class="bd'+(l.y?' y':'')+'">'+bd+'</span><span class="tx"><span class="t">'+esc(l.t)+'</span><span class="c">'+esc(l.c)+'</span></span>'+arrow+'</a></li>';
  }).join("")+'</ul>';
}).join("");

/* Muncul saat digulir (mulai setelah animasi pembuka selesai) */
var rm=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var items=[].slice.call(document.querySelectorAll(".rv"));
function startReveal(){
  if(rm||!("IntersectionObserver" in window)){items.forEach(function(e){e.classList.add("on")});return}
  var io=new IntersectionObserver(function(es){
    var d=0;
    es.forEach(function(en){if(en.isIntersecting){en.target.style.transitionDelay=(d++*70)+"ms";en.target.classList.add("on");io.unobserve(en.target)}});
  },{threshold:.12,rootMargin:"0px 0px -4% 0px"});
  items.forEach(function(e){io.observe(e)});
}
setTimeout(startReveal,rm?0:2200);

/* Bar mini dan progres.
   Di mobile: bar muncul begitu halaman digulir dan hilang saat sudah di paling atas. */
var bar=document.getElementById("bar"),prog=document.getElementById("prog"),hero=document.getElementById("hero"),tick=false,mob=matchMedia("(max-width:900px)");
function onScroll(){
  if(tick)return;tick=true;
  requestAnimationFrame(function(){
    var y=window.scrollY,h=document.documentElement.scrollHeight-window.innerHeight;
    bar.classList.toggle("show",mob.matches?y>8:y>hero.offsetHeight-60);
    prog.style.transform="scaleX("+(h>0?Math.min(y/h,1):0)+")";
    tick=false;
  });
}
window.addEventListener("scroll",onScroll,{passive:true});
window.addEventListener("resize",onScroll);onScroll();

/* Cahaya mengikuti kursor pada kartu */
document.addEventListener("pointermove",function(e){
  var a=e.target.closest&&e.target.closest("a");if(!a)return;
  var r=a.getBoundingClientRect();a.style.setProperty("--mx",(e.clientX-r.left)+"px");a.style.setProperty("--my",(e.clientY-r.top)+"px");
});
</script>
</body>
</html>
