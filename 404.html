<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>404 - Halaman Tidak Ditemukan | PE2024</title>
<meta name="description" content="Halaman yang Anda tuju tidak ditemukan di portal PE2024 Pendidikan Ekonomi Kelas Putak.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/logo.webp">

<meta property="og:type" content="website">
<meta property="og:locale" content="id_ID">
<meta property="og:site_name" content="PE2024">
<meta property="og:title" content="404 - Halaman Tidak Ditemukan | PE2024">
<meta property="og:description" content="Halaman yang Anda tuju tidak dapat ditemukan. Mohon periksa kembali alamat tautan Anda.">
<meta property="og:image" content="https://pe2024.vercel.app/img/og-profile.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme:light;
  --bg:#F1F9F4;
  --card:#FFFFFF;
  --ink:#0B2A1A;
  --muted:#5B7266;
  --line:#D3E8DA;
  --blue:#0A8F45;
  --tint:#E2F5E9;
  --sun:#FFC93C;
  --f:"Century Gothic",CenturyGothic,"Apple Gothic",Questrial,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}

/* Tepat 1 layar penuh, tanpa gulir / scrollbar */
html, body{
  height:100%;
  height:100dvh;
  margin:0;
  padding:0;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  display:grid;
  place-items:center;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f);
  font-size:1rem;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  position:relative;
  padding:20px;
}

/* Dekorasi Latar Belakang Geometris Khas PE2024 */
.bg-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.dots{position:absolute;inset:0;background-image:radial-gradient(var(--line) 1.5px,transparent 1.6px);background-size:24px 24px;opacity:.75}
.sh{position:absolute}
.s1{width:clamp(140px,30vw,260px);aspect-ratio:1;border-radius:50%;background:var(--blue);top:-40px;right:-40px;opacity:.85;animation:drift 8s ease-in-out infinite alternate}
.s2{width:clamp(90px,20vw,160px);height:clamp(45px,10vw,80px);border-radius:160px 160px 0 0;background:var(--sun);bottom:20px;left:-30px;rotate:-15deg}
@keyframes drift{to{translate:0 14px}}

/* Kartu Terpusat di Tengah Layar */
.error-box{
  position:relative;
  z-index:1;
  width:min(520px,100%);
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:32px;
  padding:clamp(32px,5vh,52px) clamp(24px,5vw,44px);
  box-shadow:0 18px 48px rgba(11,42,26,.06);
  text-align:center;
  transform-style:preserve-3d;
  will-change:transform;
  transition:transform .2s ease-out;
  animation:pop .7s var(--ease) both;
}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}

/* Tipografi Angka 404 */
.num-404{
  font-size:clamp(4.5rem,13vh,7.5rem);
  font-weight:900;
  line-height:.95;
  letter-spacing:-.04em;
  margin:0 0 clamp(10px,2vh,18px);
  background:linear-gradient(135deg,var(--blue) 25%,#055227 85%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  user-select:none;
}
.num-404 .zero{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:clamp(54px,10vh,88px);
  height:clamp(54px,10vh,88px);
  border-radius:50%;
  background:var(--tint);
  border:clamp(6px,1.2vh,10px) solid var(--blue);
  color:var(--blue);
  box-shadow:0 8px 22px rgba(10,143,69,.2);
  animation:wobble 4s ease-in-out infinite alternate;
}
.num-404 .zero svg{
  width:clamp(28px,5vh,46px);
  height:clamp(28px,5vh,46px);
  fill:none;
  stroke:var(--blue);
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
@keyframes wobble{
  0%{transform:rotate(0deg) scale(1)}
  50%{transform:rotate(10deg) scale(1.05)}
  100%{transform:rotate(-10deg) scale(.98)}
}

h1{
  font-size:clamp(1.35rem,3.4vh,1.95rem);
  line-height:1.2;
  letter-spacing:-.02em;
  margin:0 0 clamp(8px,1.6vh,14px);
  font-weight:700;
  color:var(--ink);
}
.lead{
  color:var(--muted);
  max-width:40ch;
  margin:0 auto;
  font-size:clamp(.92rem,2.2vh,1.08rem);
  line-height:1.55;
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .intro,.s1,.num-404 .zero,.error-box{animation:none;opacity:1;transform:none;transition:none}
}

/* Animasi Loading Pembuka (Preloader 2 Detik) */
.intro{
  position:fixed;inset:0;z-index:9999;background:#fff;
  display:grid;place-items:center;
  animation:lift .7s cubic-bezier(.76,0,.24,1) 2s forwards;
  pointer-events:none;
}
.intro-box{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  animation:pop .6s var(--ease) .1s both;
}
.intro .logo{width:100px;height:100px;object-fit:contain}
.intro-loader{
  width:130px;height:4px;border-radius:999px;
  background:var(--tint);overflow:hidden;position:relative;
}
.intro-bar{
  position:absolute;left:0;top:0;bottom:0;width:100%;
  background:var(--blue);border-radius:999px;
  transform-origin:left;transform:scaleX(0);
  animation:fillBar 2s cubic-bezier(.4,0,.2,1) forwards;
}
.intro-text{
  font-size:.78rem;font-weight:700;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;
  animation:pulseText 1s ease-in-out infinite alternate;
}
@keyframes fillBar{
  0%{transform:scaleX(0)}
  50%{transform:scaleX(.65)}
  100%{transform:scaleX(1)}
}
@keyframes pulseText{from{opacity:.55}to{opacity:1}}
@keyframes lift{
  0%{transform:none;opacity:1}
  99%{transform:translateY(-100%);opacity:1}
  100%{transform:translateY(-100%);opacity:0;visibility:hidden;pointer-events:none}
}
</style>
</head>
<body>

<!-- Preloader 2 Detik -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-box">
    <img class="logo" src="img/logo.webp" alt="PE2024" onerror="this.style.display='none'">
    <div class="intro-loader"><div class="intro-bar"></div></div>
    <span class="intro-text">Memuat PE2024...</span>
  </div>
</div>

<!-- Dekorasi Geometris Latar Belakang -->
<div class="bg-layer" aria-hidden="true">
  <div class="dots"></div>
  <div class="sh s1"></div>
  <div class="sh s2"></div>
</div>

<!-- Kotak Pesan 404 Terpusat -->
<div class="error-box" id="tiltBox">
  <!-- Angka 404 Khas PE2024 -->
  <div class="num-404" aria-label="404">
    <span>4</span>
    <span class="zero" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    </span>
    <span>4</span>
  </div>

  <h1>Ups! Halaman Tidak Ditemukan</h1>
  
  <p class="lead">
    Halaman yang Anda tuju tidak dapat ditemukan. Mohon periksa kembali alamat tautan Anda.
  </p>
</div>

<script>
/* Efek Tilt 3D Interaktif Lembut */
var box = document.getElementById("tiltBox");
var rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!rm && window.matchMedia("(hover: hover)").matches && box){
  window.addEventListener("mousemove", function(e){
    var rect = box.getBoundingClientRect();
    var x = (e.clientX - (rect.left + rect.width / 2)) / (window.innerWidth / 2);
    var y = (e.clientY - (rect.top + rect.height / 2)) / (window.innerHeight / 2);
    box.style.transform = "perspective(900px) rotateY(" + (x * 6) + "deg) rotateX(" + (-y * 6) + "deg)";
  });
  window.addEventListener("mouseleave", function(){
    box.style.transform = "perspective(900px) rotateY(0deg) rotateX(0deg)";
  });
}

/* Hilangkan Preloader Tepat 2 Detik */
setTimeout(function(){
  var it = document.getElementById("intro");
  if(it){ it.style.opacity = "0"; it.style.pointerEvents = "none"; setTimeout(function(){ try{ it.remove() }catch(e){} }, 700); }
}, 2000);
</script>
</body>
</html>
